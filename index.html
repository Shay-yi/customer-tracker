<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>客户记录系统 | MBH</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        body { background: #f5f5f5; }
        .card { background: #fff; border-radius: 12px; border: 1px solid #e5e5e5; }
        .card:hover { border-color: #10b981; }
        .btn { border-radius: 8px; transition: all 0.2s; }
        .btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .input { border-radius: 8px; transition: all 0.2s; }
        .input:focus { border-color: #10b981; }
        .status-btn { border-radius: 8px; }
        .status-btn.replied { background: #10b981; }
        .status-btn.unreplied { background: #f59e0b; }
        .record-item { border-left: 3px solid #e5e5e5; transition: all 0.2s; }
        .record-item.replied { border-left-color: #10b981; }
        .record-item.unreplied { border-left-color: #f59e0b; }
        .record-item:hover { background: #fafafa; }
    </style>
</head>
<body class="bg-[#f5f5f5] min-h-screen">
    <header class="bg-white border-b border-gray-200 py-4">
        <div class="container mx-auto px-6 max-w-6xl">
            <div class="flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <span class="text-2xl">📋</span>
                    <h1 class="text-xl font-semibold text-gray-800">客户记录系统</h1>
                </div>
                <div class="flex items-center gap-4">
                    <button onclick="refreshData()" class="btn bg-gray-100 hover:bg-gray-200 px-4 py-2 text-sm flex items-center gap-2 text-gray-700">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                        同步数据
                    </button>
                    <span id="lastSync" class="text-sm text-gray-400">未同步</span>
                </div>
            </div>
        </div>
    </header>

    <div class="container mx-auto px-6 py-8 max-w-6xl">
        <div class="flex items-center gap-2 mb-6">
            <span class="text-gray-500 text-sm" id="weekInfo">📅 2026年2月2日-2月8日</span>
        </div>

        <div class="grid grid-cols-4 gap-4 mb-8">
            <div class="card p-5">
                <p class="text-gray-500 text-sm">本周客户</p>
                <p class="text-3xl font-semibold text-gray-800 mt-1" id="totalCount">0</p>
            </div>
            <div class="card p-5">
                <p class="text-gray-500 text-sm">已回复</p>
                <p class="text-3xl font-semibold text-emerald-500 mt-1" id="repliedCount">0</p>
            </div>
            <div class="card p-5">
                <p class="text-gray-500 text-sm">未回复</p>
                <p class="text-3xl font-semibold text-amber-500 mt-1" id="unrepliedCount">0</p>
            </div>
            <div class="card p-5">
                <p class="text-gray-500 text-sm">成单金额</p>
                <p class="text-3xl font-semibold text-gray-800 mt-1" id="totalAmount">$0</p>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-1">
                <div class="card p-6 sticky top-4">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-lg font-medium text-gray-800" id="formTitle">新增客户</h2>
                        <button onclick="resetForm()" class="text-gray-400 hover:text-gray-600 text-sm">重置</button>
                    </div>
                    
                    <form id="customerForm" class="space-y-4">
                        <div class="flex gap-2 mb-4">
                            <button type="button" onclick="setStatus('replied')" id="statusReplied" class="status-btn flex-1 py-2.5 text-white text-sm font-medium opacity-50">
                                已回复
                            </button>
                            <button type="button" onclick="setStatus('unreplied')" id="statusUnreplied" class="status-btn unreplied flex-1 py-2.5 text-white text-sm font-medium opacity-100">
                                未回复
                            </button>
                        </div>
                        <input type="hidden" id="status" value="unreplied">
                        <input type="hidden" id="editRowIndex" value="">
                        
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-sm text-gray-600 mb-1">国家 *</label>
                                <input type="text" id="country" list="countryList" required class="input w-full px-3 py-2.5 bg-gray-50 border border-gray-200" placeholder="国家">
                                <datalist id="countryList"></datalist>
                            </div>
                            <div>
                                <label class="block text-sm text-gray-600 mb-1">区域</label>
                                <input type="text" id="region" list="regionList" class="input w-full px-3 py-2.5 bg-gray-50 border border-gray-200" placeholder="区域">
                                <datalist id="regionList">
                                    <option value="东南亚">
                                    <option value="欧洲">
                                    <option value="中东">
                                    <option value="南美洲">
                                    <option value="北美洲">
                                    <option value="大洋洲">
                                </datalist>
                            </div>
                        </div>
                        
                        <div>
                            <label class="block text-sm text-gray-600 mb-1">客户名称 *</label>
                            <input type="text" id="customerName" required class="input w-full px-3 py-2.5 bg-gray-50 border border-gray-200" placeholder="公司或个人名称">
                        </div>
                        
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-sm text-gray-600 mb-1">电话 *</label>
                                <input type="tel" id="phone" required class="input w-full px-3 py-2.5 bg-gray-50 border border-gray-200" placeholder="必填">
                            </div>
                            <div>
                                <label class="block text-sm text-gray-600 mb-1">邮箱</label>
                                <input type="email" id="email" class="input w-full px-3 py-2.5 bg-gray-50 border border-gray-200" placeholder="可选">
                            </div>
                        </div>
                        
                        <div>
                            <label class="block text-sm text-gray-600 mb-1">获客途径</label>
                            <input type="text" id="source" list="sourceList" class="input w-full px-3 py-2.5 bg-gray-50 border border-gray-200" placeholder="来源">
                            <datalist id="sourceList">
                                <option value="Alibaba">
                                <option value="Made-in-China">
                                <option value="Google搜索">
                                <option value="展会">
                                <option value="社交媒体">
                                <option value="老客户推荐">
                            </datalist>
                        </div>
                        
                        <div>
                            <label class="block text-sm text-gray-600 mb-1">客户背景</label>
                            <input type="text" id="background" class="input w-full px-3 py-2.5 bg-gray-50 border border-gray-200" placeholder="如：健身房">
                        </div>
                        
                        <div>
                            <label class="block text-sm text-gray-600 mb-1">成单金额 (USD)</label>
                            <input type="number" id="amount" class="input w-full px-3 py-2.5 bg-gray-50 border border-gray-200" placeholder="0">
                        </div>
                        
                        <div>
                            <label class="block text-sm text-gray-600 mb-1">具体需求</label>
                            <textarea id="details" rows="2" class="input w-full px-3 py-2.5 bg-gray-50 border border-gray-200 resize-none" placeholder="需求描述"></textarea>
                        </div>
                        
                        <button type="submit" id="submitBtn" class="btn w-full py-3 bg-emerald-500 text-white font-medium flex items-center justify-center gap-2">
                            保存客户信息
                        </button>
                    </form>
                </div>
            </div>
            
            <div class="lg:col-span-2">
                <div class="card p-4 mb-4 flex gap-3">
                    <input type="text" id="searchInput" oninput="filterRecords()" placeholder="搜索客户名称、电话..." class="input flex-1 px-4 py-2.5 bg-gray-50 border border-gray-200">
                    <select id="statusFilter" onchange="filterRecords()" class="input px-4 py-2.5 bg-gray-50 border border-gray-200">
                        <option value="">全部状态</option>
                        <option value="replied">已回复</option>
                        <option value="unreplied">未回复</option>
                    </select>
                </div>
                
                <div class="card">
                    <div class="p-4 border-b border-gray-100 flex justify-between items-center">
                        <h2 class="text-lg font-medium text-gray-800">本周记录</h2>
                        <span id="recordCount" class="text-sm text-gray-400">0 条</span>
                    </div>
                    <div id="recordsList" class="divide-y divide-gray-100">
                        <p class="text-gray-400 text-center py-12">点击"同步数据"获取最新...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="toast" class="fixed bottom-6 right-6 hidden px-4 py-2 rounded-lg shadow text-sm"></div>

    <script>
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbyVIUjpgIo4nCg1_HVubQ4h5ZOvmbkOZaungg6DpMN9fZLbY1adPlabArM6V1C_L5duNA/exec';
        let allRecords = [];
        let filteredRecords = [];
        
        const regionOptions = ['东南亚', '欧洲', '中东', '南美洲', '北美洲', '大洋洲', '南亚', '非洲'];
        const sourceOptions = ['Alibaba', 'Made-in-China', 'Google搜索', '展会', '社交媒体', '老客户推荐'];
        const countryOptions = ['USA', 'UK', 'Germany', 'France', 'Australia', 'Canada', 'Japan', 'South Korea', 'Singapore', 'Malaysia', 'Thailand', 'Vietnam', 'Indonesia', 'UAE', 'Brazil'];
        
        document.getElementById('regionList').innerHTML = regionOptions.map(r => `<option value="${r}">`).join('');
        document.getElementById('sourceList').innerHTML = sourceOptions.map(s => `<option value="${s}">`).join('');
        document.getElementById('countryList').innerHTML = countryOptions.map(c => `<option value="${c}">`).join('');

        function setStatus(status) {
            document.getElementById('status').value = status;
            document.getElementById('statusReplied').className = 'status-btn flex-1 py-2.5 text-white text-sm font-medium ' + (status === 'replied' ? 'replied opacity-100' : 'opacity-50');
            document.getElementById('statusUnreplied').className = 'status-btn flex-1 py-2.5 text-white text-sm font-medium ' + (status === 'unreplied' ? 'unreplied opacity-100' : 'opacity-50');
        }

        function updateWeekInfo() {
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth() + 1;
            const day = now.getDate();
            const weekStart = new Date(now);
            weekStart.setDate(now.getDate() - now.getDay() + 1);
            const weekEnd = new Date(weekStart);
            weekEnd.setDate(weekStart.getDate() + 6);
            document.getElementById('weekInfo').textContent = `${year}年${month}月 ${weekStart.getDate()}-${weekEnd.getDate()}日`;
        }

        function loadFromStorage() {
            const saved = localStorage.getItem('customerRecords');
            if (saved) {
                try {
                    allRecords = JSON.parse(saved);
                    filterRecords();
                    document.getElementById('lastSync').textContent = '本地缓存';
                    document.getElementById('lastSync').className = 'text-sm text-amber-500';
                } catch (e) {}
            }
        }

        function saveToStorage() {
            localStorage.setItem('customerRecords', JSON.stringify(allRecords));
        }

        function refreshData() {
            const listEl = document.getElementById('recordsList');
            listEl.innerHTML = '<p class="text-gray-400 text-center py-12">同步中...</p>';
            
            const btn = document.querySelector('button[onclick="refreshData()"]');
            const originalHTML = btn.innerHTML;
            btn.innerHTML = '同步中...';
            
            fetch(GAS_URL + '?action=list')
                .then(response => response.json())
                .then(result => {
                    if (result.success) {
                        allRecords = result.records || [];
                        saveToStorage();
                        filterRecords();
                        document.getElementById('lastSync').textContent = '已同步';
                        document.getElementById('lastSync').className = 'text-sm text-emerald-500';
                        showToast('同步成功 (' + allRecords.length + ' 条)');
                    } else {
                        listEl.innerHTML = '<p class="text-red-500 text-center py-12">' + (result.message || '同步失败') + '</p>';
                        showToast(result.message || '同步失败', 'error');
                    }
                })
                .catch(error => {
                    listEl.innerHTML = '<p class="text-red-500 text-center py-12">同步失败: ' + error.message + '</p>';
                    showToast(error.message, 'error');
                })
                .finally(() => {
                    btn.innerHTML = originalHTML;
                });
        }

        function filterRecords() {
            const keyword = document.getElementById('searchInput').value.toLowerCase().trim();
            const statusFilter = document.getElementById('statusFilter').value;
            
            filteredRecords = allRecords.filter(r => {
                const match = !keyword || r.customerName.toLowerCase().includes(keyword) || r.phone.includes(keyword);
                const matchStatus = !statusFilter || r.status === statusFilter;
                return match && matchStatus;
            });
            
            renderRecords();
            updateStats();
        }

        function renderRecords() {
            const listEl = document.getElementById('recordsList');
            document.getElementById('recordCount').textContent = filteredRecords.length + ' 条';
            
            if (filteredRecords.length === 0) {
                listEl.innerHTML = '<p class="text-gray-400 text-center py-12">暂无记录</p>';
                return;
            }
            
            const sorted = [...filteredRecords].sort((a, b) => new Date(b.time) - new Date(a.time));
            
            listEl.innerHTML = sorted.map(r => `
                <div class="record-item p-4 ${r.status === 'replied' ? 'replied' : 'unreplied'}">
                    <div class="flex justify-between items-start">
                        <div class="flex-1">
                            <div class="flex items-center gap-2 mb-1 flex-wrap">
                                <span class="font-medium text-gray-800">${r.customerName}</span>
                                <span class="text-xs px-2 py-0.5 rounded ${r.status === 'replied' ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}">${r.status === 'replied' ? '已回复' : '未回复'}</span>
                                ${r.country ? '<span class="text-xs px-2 py-0.5 rounded bg-blue-100 text-blue-700">' + r.country + '</span>' : ''}
                                ${r.region ? '<span class="text-xs px-2 py-0.5 rounded bg-gray-100 text-gray-600">' + r.region + '</span>' : ''}
                            </div>
                            <div class="text-sm text-gray-500 flex flex-wrap gap-3">
                                <span>📞 ${r.phone}</span>
                                ${r.email ? '<span>📧 ' + r.email + '</span>' : ''}
                                ${r.background ? '<span>🏢 ' + r.background + '</span>' : ''}
                                ${r.source ? '<span>📢 ' + r.source + '</span>' : ''}
                            </div>
                            ${r.details ? '<p class="text-sm text-gray-400 mt-1">' + r.details + '</p>' : ''}
                        </div>
                        <div class="text-right">
                            <p class="font-semibold ${r.status === 'replied' ? 'text-emerald-500' : 'text-gray-400'}">$${(r.amount || 0).toLocaleString()}</p>
                            <p class="text-xs text-gray-400 mt-1">${formatDate(r.time)}</p>
                            <button onclick="editRecord('${r.phone}')" class="text-xs text-blue-500 hover:text-blue-700 mt-2">编辑</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function resetForm() {
            document.getElementById('customerForm').reset();
            document.getElementById('formTitle').textContent = '新增客户';
            document.getElementById('editRowIndex').value = '';
            setStatus('unreplied');
            document.getElementById('submitBtn').innerHTML = '保存客户信息';
        }

        function editRecord(phone) {
            const r = allRecords.find(rec => rec.phone === phone);
            if (!r) return;
            
            document.getElementById('formTitle').textContent = '编辑客户';
            document.getElementById('status').value = r.status || 'unreplied';
            setStatus(r.status || 'unreplied');
            document.getElementById('country').value = r.country || '';
            document.getElementById('region').value = r.region || '';
            document.getElementById('customerName').value = r.customerName || '';
            document.getElementById('phone').value = r.phone || '';
            document.getElementById('email').value = r.email || '';
            document.getElementById('source').value = r.source || '';
            document.getElementById('background').value = r.background || '';
            document.getElementById('amount').value = r.amount || '';
            document.getElementById('details').value = r.details || '';
            document.getElementById('editRowIndex').value = r.phone;
            
            document.getElementById('submitBtn').innerHTML = '更新记录';
            window.scrollTo({ top: 0, behavior: 'smooth' });
            showToast('编辑: ' + r.customerName);
        }

        function updateStats() {
            document.getElementById('totalCount').textContent = filteredRecords.length;
            document.getElementById('repliedCount').textContent = filteredRecords.filter(r => r.status === 'replied').length;
            document.getElementById('unrepliedCount').textContent = filteredRecords.filter(r => r.status !== 'replied').length;
            
            const total = filteredRecords.filter(r => r.status === 'replied').reduce((sum, r) => sum + (parseFloat(r.amount) || 0), 0);
            document.getElementById('totalAmount').textContent = '$' + total.toLocaleString();
        }

        function formatDate(dateStr) {
            const d = new Date(dateStr);
            return d.toLocaleDateString('zh-CN', { month: 'short', day: 'numeric' });
        }

        document.getElementById('customerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const data = {
                phone: document.getElementById('phone').value.trim(),
                country: document.getElementById('country').value.trim(),
                region: document.getElementById('region').value.trim(),
                customerName: document.getElementById('customerName').value.trim(),
                source: document.getElementById('source').value,
                background: document.getElementById('background').value.trim(),
                details: document.getElementById('details').value.trim(),
                amount: parseFloat(document.getElementById('amount').value) || 0,
                email: document.getElementById('email').value.trim(),
                status: document.getElementById('status').value,
                originalPhone: document.getElementById('editRowIndex').value
            };

            if (!data.phone || !data.country || !data.customerName) {
                showToast('请填写必填字段', 'error');
                return;
            }

            const btn = document.getElementById('submitBtn');
            const isEdit = !!data.originalPhone;
            const originalText = btn.innerHTML;
            btn.innerHTML = '保存中...';
            btn.disabled = true;

            try {
                const response = await fetch(GAS_URL + (isEdit ? '?action=update' : ''), {
                    method: 'POST',
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showToast(result.message);
                    resetForm();
                    refreshData();
                } else {
                    showToast(result.message, result.existing ? 'warning' : 'error');
                    if (result.existing) refreshData();
                }
            } catch (error) {
                showToast(error.message, 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        });

        function showToast(msg, type = 'success') {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.className = 'fixed bottom-6 right-6 px-4 py-2 rounded-lg shadow text-sm ' + (type === 'success' ? 'bg-emerald-500 text-white' : type === 'error' ? 'bg-red-500 text-white' : 'bg-amber-500 text-white');
            el.classList.remove('hidden');
            setTimeout(() => el.classList.add('hidden'), 2500);
        }

        updateWeekInfo();
        loadFromStorage();
    </script>
</body>
</html>
