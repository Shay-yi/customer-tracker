<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>客户记录系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:400;500;600;700&family=Space+Grotesk:700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #18181b;
            --accent: #10b981;
            --accent-dark: #059669;
            --amber: #f59e0b;
            --zinc-50: #fafafa;
            --zinc-100: #f4f4f5;
            --zinc-200: #e4e4e7;
            --zinc-400: #a1a1aa;
            --zinc-500: #71717a;
            --zinc-900: #18181b;
        }
        * { font-family: 'Plus Jakarta Sans', sans-serif; box-sizing: border-box; }
        body { background: var(--zinc-50); color: var(--zinc-900); }
        h1, h2, h3, .display { font-family: 'Space Grotesk', sans-serif; }
        .card { background: white; border: 1px solid var(--zinc-200); transition: all 0.2s; }
        .card:hover { border-color: var(--accent); }
        .input { 
            background: white; border: 1px solid var(--zinc-200); 
            transition: all 0.2s; font-size: 14px;
        }
        .input:focus { border-color: var(--accent); outline: none; }
        .btn-primary { 
            background: var(--accent); color: white; font-weight: 600;
            transition: all 0.2s;
        }
        .btn-primary:hover { background: var(--accent-dark); }
        .btn-sync { 
            background: var(--zinc-100); color: var(--zinc-500); font-weight: 500;
            border: 1px solid var(--zinc-200);
            transition: all 0.2s;
        }
        .btn-sync:hover { background: var(--zinc-200); color: var(--zinc-900); }
        .badge { 
            font-size: 11px; font-weight: 600; letter-spacing: 0.02em;
            padding: 4px 10px; border-radius: 9999px;
        }
        .badge-replied { background: #dcfce7; color: #166534; }
        .badge-unreplied { background: #fef3c7; color: #92400e; }
        .record-item { 
            border-left: 3px solid var(--zinc-200); 
            transition: all 0.2s; background: white;
        }
        .record-item.replied { border-left-color: var(--accent); }
        .record-item.unreplied { border-left-color: var(--amber); }
        .record-item:hover { background: var(--zinc-50); }
        .status-btn {
            font-size: 13px; font-weight: 600; padding: 10px 16px;
            border-radius: 8px; transition: all 0.2s; border: none; cursor: pointer;
        }
        .status-replied { background: var(--accent); color: white; }
        .status-unreplied { background: var(--amber); color: white; }
        .status-inactive { background: var(--zinc-100); color: var(--zinc-400); border: 1px solid var(--zinc-200); }
        .fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="min-h-screen">
    <header class="border-b border-gray-200 bg-white sticky top-0 z-10">
        <div class="max-w-7xl mx-auto px-6 py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-zinc-900 flex items-center justify-center">
                        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
                    </div>
                    <div>
                        <h1 class="text-lg font-semibold tracking-tight">客户记录系统</h1>
                        <p class="text-xs text-zinc-500" id="weekInfo">2026年2月2日-8日</p>
                    </div>
                </div>
                <div class="flex items-center gap-4">
                    <button onclick="refreshData()" id="syncBtn" class="btn-sync px-4 py-2 rounded-lg text-sm flex items-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                        同步
                    </button>
                    <span id="lastSync" class="text-xs text-zinc-400">未同步</span>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-8">
        <div class="grid grid-cols-4 gap-4 mb-8">
            <div class="card p-5 rounded-2xl">
                <p class="text-xs font-medium text-zinc-500 uppercase tracking-wider">本周客户</p>
                <p class="text-3xl font-bold mt-2 tracking-tight" id="totalCount">0</p>
            </div>
            <div class="card p-5 rounded-2xl">
                <p class="text-xs font-medium text-zinc-500 uppercase tracking-wider">已回复</p>
                <p class="text-3xl font-bold mt-2 tracking-tight text-emerald-600" id="repliedCount">0</p>
            </div>
            <div class="card p-5 rounded-2xl">
                <p class="text-xs font-medium text-zinc-500 uppercase tracking-wider">未回复</p>
                <p class="text-3xl font-bold mt-2 tracking-tight text-amber-600" id="unrepliedCount">0</p>
            </div>
            <div class="card p-5 rounded-2xl">
                <p class="text-xs font-medium text-zinc-500 uppercase tracking-wider">成单金额</p>
                <p class="text-3xl font-bold mt-2 tracking-tight" id="totalAmount">$0</p>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-1">
                <div class="card p-6 rounded-2xl sticky top-24">
                    <div class="flex items-center justify-between mb-6">
                        <h2 class="text-base font-semibold" id="formTitle">新增客户</h2>
                        <button onclick="resetForm()" class="btn-sync px-3 py-1.5 rounded-lg text-xs">重置</button>
                    </div>
                    
                    <form id="customerForm" class="space-y-4">
                        <div class="flex gap-2">
                            <button type="button" onclick="setStatus('replied')" id="statusReplied" class="status-btn status-inactive flex-1">已回复</button>
                            <button type="button" onclick="setStatus('unreplied')" id="statusUnreplied" class="status-btn status-unreplied flex-1">未回复</button>
                        </div>
                        <input type="hidden" id="status" value="unreplied">
                        <input type="hidden" id="editRowIndex" value="">
                        
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-medium text-zinc-600 mb-1.5">国家 *</label>
                                <input type="text" id="country" list="countryList" required class="input w-full px-3 py-2.5 rounded-lg" placeholder="国家">
                                <datalist id="countryList"></datalist>
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-zinc-600 mb-1.5">区域</label>
                                <input type="text" id="region" list="regionList" class="input w-full px-3 py-2.5 rounded-lg" placeholder="区域">
                                <datalist id="regionList">
                                    <option value="东南亚">
                                    <option value="欧洲">
                                    <option value="中东">
                                    <option value="南美洲">
                                    <option value="北美洲">
                                    <option value="大洋洲">
                                </datalist>
                            </div>
                        </div>
                        
                        <div>
                            <label class="block text-xs font-medium text-zinc-600 mb-1.5">客户名称 *</label>
                            <input type="text" id="customerName" required class="input w-full px-3 py-2.5 rounded-lg" placeholder="公司或个人名称">
                        </div>
                        
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-medium text-zinc-600 mb-1.5">电话 *</label>
                                <input type="tel" id="phone" required class="input w-full px-3 py-2.5 rounded-lg" placeholder="必填">
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-zinc-600 mb-1.5">邮箱</label>
                                <input type="email" id="email" class="input w-full px-3 py-2.5 rounded-lg" placeholder="可选">
                            </div>
                        </div>
                        
                        <div>
                            <label class="block text-xs font-medium text-zinc-600 mb-1.5">获客途径</label>
                            <input type="text" id="source" list="sourceList" class="input w-full px-3 py-2.5 rounded-lg" placeholder="来源">
                            <datalist id="sourceList">
                                <option value="Alibaba">
                                <option value="Made-in-China">
                                <option value="Google搜索">
                                <option value="展会">
                                <option value="社交媒体">
                                <option value="老客户推荐">
                            </datalist>
                        </div>
                        
                        <div>
                            <label class="block text-xs font-medium text-zinc-600 mb-1.5">客户背景</label>
                            <input type="text" id="background" class="input w-full px-3 py-2.5 rounded-lg" placeholder="如：健身房">
                        </div>
                        
                        <div>
                            <label class="block text-xs font-medium text-zinc-600 mb-1.5">成单金额 (USD)</label>
                            <input type="number" id="amount" class="input w-full px-3 py-2.5 rounded-lg" placeholder="0">
                        </div>
                        
                        <div>
                            <label class="block text-xs font-medium text-zinc-600 mb-1.5">具体需求</label>
                            <textarea id="details" rows="2" class="input w-full px-3 py-2.5 rounded-lg resize-none" placeholder="需求描述"></textarea>
                        </div>
                        
                        <button type="submit" id="submitBtn" class="btn-primary w-full py-3 rounded-xl flex items-center justify-center gap-2 text-sm">
                            保存客户信息
                        </button>
                    </form>
                </div>
            </div>
            
            <div class="lg:col-span-2">
                <div class="card p-4 mb-4 rounded-xl flex gap-3">
                    <input type="text" id="searchInput" oninput="filterRecords()" placeholder="搜索客户名称、电话..." class="input flex-1 px-4 py-2.5 rounded-lg">
                    <select id="statusFilter" onchange="filterRecords()" class="input px-4 py-2.5 rounded-lg">
                        <option value="">全部状态</option>
                        <option value="replied">已回复</option>
                        <option value="unreplied">未回复</option>
                    </select>
                </div>
                
                <div class="card rounded-2xl overflow-hidden">
                    <div class="p-4 border-b border-gray-100 flex justify-between items-center">
                        <h2 class="text-base font-semibold">本周记录</h2>
                        <span id="recordCount" class="text-xs text-zinc-400">0 条</span>
                    </div>
                    <div id="recordsList" class="divide-y divide-gray-100">
                        <p class="text-zinc-400 text-center py-16 text-sm">点击"同步"获取数据</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="toast" class="fixed bottom-6 right-6 hidden px-4 py-2.5 rounded-lg shadow-lg text-sm font-medium fade-in"></div>

    <script>
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbyVIUjpgIo4nCg1_HVubQ4h5ZOvmbkOZaungg6DpMN9fZLbY1adPlabArM6V1C_L5duNA/exec';
        let allRecords = [];
        let filteredRecords = [];
        
        const regionOptions = ['东南亚', '欧洲', '中东', '南美洲', '北美洲', '大洋洲', '南亚', '非洲'];
        const sourceOptions = ['Alibaba', 'Made-in-China', 'Google搜索', '展会', '社交媒体', '老客户推荐'];
        const countryOptions = ['USA', 'UK', 'Germany', 'France', 'Australia', 'Canada', 'Japan', 'South Korea', 'Singapore', 'Malaysia', 'Thailand', 'Vietnam', 'Indonesia', 'UAE', 'Brazil'];
        
        document.getElementById('regionList').innerHTML = regionOptions.map(r => `<option value="${r}">`).join('');
        document.getElementById('sourceList').innerHTML = sourceOptions.map(s => `<option value="${s}">`).join('');
        document.getElementById('countryList').innerHTML = countryOptions.map(c => `<option value="${c}">`).join('');

        // 初始化状态按钮
        setStatus('unreplied');

        function setStatus(status) {
            document.getElementById('status').value = status;
            const repliedBtn = document.getElementById('statusReplied');
            const unrepliedBtn = document.getElementById('statusUnreplied');
            
            if (status === 'replied') {
                repliedBtn.className = 'status-btn status-replied flex-1';
                unrepliedBtn.className = 'status-btn status-inactive flex-1';
            } else {
                repliedBtn.className = 'status-btn status-inactive flex-1';
                unrepliedBtn.className = 'status-btn status-unreplied flex-1';
            }
        }

        function updateWeekInfo() {
            const now = new Date();
            const start = new Date(now);
            start.setDate(now.getDate() - now.getDay() + 1);
            const end = new Date(start);
            end.setDate(start.getDate() + 6);
            document.getElementById('weekInfo').textContent = `${start.getMonth() + 1}月${start.getDate()}日 - ${end.getMonth() + 1}月${end.getDate()}日`;
        }

        function loadFromStorage() {
            const saved = localStorage.getItem('customerRecords');
            if (saved) {
                try {
                    allRecords = JSON.parse(saved);
                    filterRecords();
                    document.getElementById('lastSync').textContent = '本地缓存';
                    document.getElementById('lastSync').className = 'text-xs text-amber-600';
                } catch (e) {}
            }
        }

        function saveToStorage() {
            localStorage.setItem('customerRecords', JSON.stringify(allRecords));
        }

        function refreshData() {
            const listEl = document.getElementById('recordsList');
            listEl.innerHTML = '<p class="text-zinc-400 text-center py-16 text-sm">同步中...</p>';
            
            const btn = document.getElementById('syncBtn');
            btn.disabled = true;
            btn.innerHTML = '<svg class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> 同步中';
            
            fetch(GAS_URL + '?action=list')
                .then(response => response.json())
                .then(result => {
                    if (result.success) {
                        allRecords = result.records || [];
                        saveToStorage();
                        filterRecords();
                        document.getElementById('lastSync').textContent = '已同步';
                        document.getElementById('lastSync').className = 'text-xs text-emerald-600';
                        showToast('同步成功 (' + allRecords.length + ' 条)');
                    } else {
                        listEl.innerHTML = '<p class="text-red-500 text-center py-16 text-sm">' + (result.message || '同步失败') + '</p>';
                        showToast(result.message || '同步失败', 'error');
                    }
                })
                .catch(error => {
                    listEl.innerHTML = '<p class="text-red-500 text-center py-16 text-sm">同步失败: ' + error.message + '</p>';
                    showToast(error.message, 'error');
                })
                .finally(() => {
                    btn.disabled = false;
                    btn.innerHTML = '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg> 同步';
                });
        }

        function filterRecords() {
            const keyword = document.getElementById('searchInput').value.toLowerCase().trim();
            const statusFilter = document.getElementById('statusFilter').value;
            
            filteredRecords = allRecords.filter(r => {
                const match = !keyword || r.customerName.toLowerCase().includes(keyword) || r.phone.includes(keyword);
                const matchStatus = !statusFilter || r.status === statusFilter;
                return match && matchStatus;
            });
            
            renderRecords();
            updateStats();
        }

        function renderRecords() {
            const listEl = document.getElementById('recordsList');
            document.getElementById('recordCount').textContent = filteredRecords.length + ' 条';
            
            if (filteredRecords.length === 0) {
                listEl.innerHTML = '<p class="text-zinc-400 text-center py-16 text-sm">暂无记录</p>';
                return;
            }
            
            const sorted = [...filteredRecords].sort((a, b) => new Date(b.time) - new Date(a.time));
            
            listEl.innerHTML = sorted.map((r, i) => `
                <div class="record-item p-4 ${r.status === 'replied' ? 'replied' : 'unreplied'} fade-in">
                    <div class="flex justify-between items-start">
                        <div class="flex-1">
                            <div class="flex items-center gap-2 mb-2 flex-wrap">
                                <span class="font-semibold text-zinc-900">${r.customerName}</span>
                                <span class="badge ${r.status === 'replied' ? 'badge-replied' : 'badge-unreplied'}">${r.status === 'replied' ? '已回复' : '未回复'}</span>
                                ${r.country ? '<span class="badge bg-zinc-100 text-zinc-600">' + r.country + '</span>' : ''}
                                ${r.region ? '<span class="badge bg-zinc-100 text-zinc-600">' + r.region + '</span>' : ''}
                            </div>
                            <div class="text-sm text-zinc-500 flex flex-wrap gap-4">
                                <span>📞 ${r.phone}</span>
                                ${r.email ? '<span>📧 ' + r.email + '</span>' : ''}
                                ${r.background ? '<span>🏢 ' + r.background + '</span>' : ''}
                                ${r.source ? '<span>📢 ' + r.source + '</span>' : ''}
                            </div>
                            ${r.details ? '<p class="text-sm text-zinc-400 mt-2">' + r.details + '</p>' : ''}
                        </div>
                        <div class="text-right ml-4">
                            <p class="font-bold ${r.status === 'replied' ? 'text-emerald-600' : 'text-zinc-400'}">$${(r.amount || 0).toLocaleString()}</p>
                            <p class="text-xs text-zinc-400 mt-1.5">${formatDate(r.time)}</p>
                            <button onclick="editRecord('${r.phone}')" class="text-xs text-zinc-500 hover:text-zinc-800 mt-2 font-medium">编辑</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function resetForm() {
            document.getElementById('customerForm').reset();
            document.getElementById('formTitle').textContent = '新增客户';
            document.getElementById('editRowIndex').value = '';
            setStatus('unreplied');
            document.getElementById('submitBtn').innerHTML = '保存客户信息';
        }

        function editRecord(phone) {
            // 从所有记录中查找（不是 filteredRecords）
            const r = allRecords.find(rec => rec.phone === phone);
            if (!r) {
                showToast('记录不存在', 'error');
                return;
            }
            
            document.getElementById('formTitle').textContent = '编辑客户';
            document.getElementById('status').value = r.status || 'unreplied';
            setStatus(r.status || 'unreplied');
            document.getElementById('country').value = r.country || '';
            document.getElementById('region').value = r.region || '';
            document.getElementById('customerName').value = r.customerName || '';
            document.getElementById('phone').value = r.phone || '';
            document.getElementById('email').value = r.email || '';
            document.getElementById('source').value = r.source || '';
            document.getElementById('background').value = r.background || '';
            document.getElementById('amount').value = r.amount || '';
            document.getElementById('details').value = r.details || '';
            document.getElementById('editRowIndex').value = r.phone;
            
            document.getElementById('submitBtn').innerHTML = '更新记录';
            window.scrollTo({ top: 0, behavior: 'smooth' });
            showToast('编辑: ' + r.customerName);
        }

        function updateStats() {
            document.getElementById('totalCount').textContent = filteredRecords.length;
            document.getElementById('repliedCount').textContent = filteredRecords.filter(r => r.status === 'replied').length;
            document.getElementById('unrepliedCount').textContent = filteredRecords.filter(r => r.status !== 'replied').length;
            
            const total = filteredRecords.filter(r => r.status === 'replied').reduce((sum, r) => sum + (parseFloat(r.amount) || 0), 0);
            document.getElementById('totalAmount').textContent = '$' + total.toLocaleString();
        }

        function formatDate(dateStr) {
            const d = new Date(dateStr);
            return d.toLocaleDateString('zh-CN', { month: 'short', day: 'numeric' });
        }

        document.getElementById('customerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const data = {
                phone: document.getElementById('phone').value.trim(),
                country: document.getElementById('country').value.trim(),
                region: document.getElementById('region').value.trim(),
                customerName: document.getElementById('customerName').value.trim(),
                source: document.getElementById('source').value,
                background: document.getElementById('background').value.trim(),
                details: document.getElementById('details').value.trim(),
                amount: parseFloat(document.getElementById('amount').value) || 0,
                email: document.getElementById('email').value.trim(),
                status: document.getElementById('status').value,
                originalPhone: document.getElementById('editRowIndex').value
            };

            if (!data.phone || !data.country || !data.customerName) {
                showToast('请填写必填字段', 'error');
                return;
            }

            const btn = document.getElementById('submitBtn');
            const isEdit = !!data.originalPhone;
            const originalText = btn.innerHTML;
            btn.innerHTML = '保存中...';
            btn.disabled = true;

            try {
                const response = await fetch(GAS_URL + (isEdit ? '?action=update' : ''), {
                    method: 'POST',
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showToast(result.message);
                    resetForm();
                    refreshData();
                } else {
                    showToast(result.message, result.existing ? 'warning' : 'error');
                    if (result.existing) refreshData();
                }
            } catch (error) {
                showToast(error.message, 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        });

        function showToast(msg, type = 'success') {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.className = 'fixed bottom-6 right-6 px-4 py-2.5 rounded-lg shadow-lg text-sm font-medium fade-in ' + 
                (type === 'success' ? 'bg-zinc-900 text-white' : type === 'error' ? 'bg-red-500 text-white' : 'bg-amber-500 text-white');
            el.classList.remove('hidden');
            setTimeout(() => el.classList.add('hidden'), 2500);
        }

        updateWeekInfo();
        loadFromStorage();
    </script>
</body>
</html>
