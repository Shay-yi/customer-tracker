<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>客户记录系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-4xl">
        <h1 class="text-3xl font-bold text-center mb-8 text-gray-800">📋 客户记录系统</h1>
        
        <!-- 表单 -->
        <div class="bg-white rounded-2xl shadow-lg p-6 mb-8">
            <form id="customerForm" class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">📞 电话号码 *</label>
                        <input type="tel" id="phone" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-400 focus:outline-none" placeholder="请输入电话号码">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">🌍 国家 *</label>
                        <input type="text" id="country" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-400 focus:outline-none" placeholder="如：USA">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">📍 区域</label>
                        <input type="text" id="region" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-400 focus:outline-none" placeholder="如：California">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">👤 客户名称 *</label>
                        <input type="text" id="customerName" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-400 focus:outline-none" placeholder="客户公司或个人名称">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">📢 获客途径</label>
                        <select id="source" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-400 focus:outline-none">
                            <option value="">请选择</option>
                            <option value="Alibaba">Alibaba</option>
                            <option value="Made-in-China">Made-in-China</option>
                            <option value="Google搜索">Google搜索</option>
                            <option value="展会">展会</option>
                            <option value="社交媒体">社交媒体</option>
                            <option value="老客户推荐">老客户推荐</option>
                            <option value="其他">其他</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">🏢 客户背景</label>
                        <input type="text" id="background" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-400 focus:outline-none" placeholder="如：健身房、经销商等">
                    </div>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">📝 具体需求</label>
                    <textarea id="details" rows="3" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-400 focus:outline-none" placeholder="客户的具体需求..."></textarea>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">💰 成单金额 (USD)</label>
                    <input type="number" id="amount" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-400 focus:outline-none" placeholder="0">
                </div>
                
                <button type="submit" class="w-full bg-emerald-500 text-white py-3 rounded-lg font-bold hover:bg-emerald-600 transition-colors">
                    💾 保存客户信息
                </button>
            </form>
        </div>
        
        <!-- 提示消息 -->
        <div id="message" class="hidden p-4 rounded-lg mb-4"></div>
        
        <!-- 最近记录 -->
        <div class="bg-white rounded-2xl shadow-lg p-6">
            <h2 class="text-xl font-bold mb-4 text-gray-800">📜 本周记录</h2>
            <div id="recordsList" class="space-y-3">
                <p class="text-gray-500 text-center py-4">暂无记录</p>
            </div>
        </div>
    </div>

    <script>
        // 配置你的 GAS Web App URL
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbwtBYl3LNMhsVYrgLMmFWu1XEt--MydD-tpgl0LKZPJwxLtP2p1cHiZUeorEyIzQsb7/exec';

        document.getElementById('customerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const data = {
                phone: document.getElementById('phone').value.trim(),
                country: document.getElementById('country').value.trim(),
                region: document.getElementById('region').value.trim(),
                customerName: document.getElementById('customerName').value.trim(),
                source: document.getElementById('source').value,
                background: document.getElementById('background').value.trim(),
                details: document.getElementById('details').value.trim(),
                amount: parseFloat(document.getElementById('amount').value) || 0
            };

            if (!data.phone || !data.country || !data.customerName) {
                showMessage('请填写必填字段', 'error');
                return;
            }

            try {
                const response = await fetch(GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showMessage(result.message, 'success');
                    document.getElementById('customerForm').reset();
                    loadRecords();
                } else {
                    showMessage(result.message, 'error');
                }
            } catch (error) {
                showMessage('提交失败: ' + error.message, 'error');
            }
        });

        function showMessage(msg, type) {
            const el = document.getElementById('message');
            el.textContent = msg;
            el.className = `p-4 rounded-lg mb-4 ${type === 'success' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}`;
            el.classList.remove('hidden');
            setTimeout(() => el.classList.add('hidden'), 5000);
        }

        async function loadRecords() {
            // 加载本周记录
            console.log('加载记录...');
        }
    </script>
</body>
</html>
