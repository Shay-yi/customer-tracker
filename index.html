<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>客户记录系统 | MBH</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass { background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); }
        .card-hover { transition: all 0.3s ease; }
        .card-hover:hover { transform: translateY(-2px); box-shadow: 0 20px 40px -12px rgba(0,0,0,0.1); }
        .gradient-bg { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .input-focus { transition: all 0.2s; }
        .input-focus:focus { box-shadow: 0 0 0 3px rgba(16,185,129,0.2); }
        .btn-primary { background: linear-gradient(135deg, #10b981 0%, #059669 100%); }
        .btn-primary:hover { background: linear-gradient(135deg, #059669 0%, #047857 100%); }
        .status-yes { background: linear-gradient(135deg, #10b981 0%, #059669 100%); }
        .status-no { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <!-- Header -->
    <header class="gradient-bg text-white py-6 shadow-lg">
        <div class="container mx-auto px-4 max-w-6xl">
            <div class="flex justify-between items-center">
                <div>
                    <h1 class="text-2xl font-bold flex items-center gap-2">
                        <span class="text-3xl">📋</span> 客户记录系统
                    </h1>
                    <p id="weekInfo" class="text-white/80 text-sm mt-1">📅 2026年2月2日-2月8日（第1周） · 本周数据</p>
                </div>
                <div class="flex items-center gap-4">
                    <button onclick="refreshData()" class="bg-white/20 hover:bg-white/30 px-4 py-2 rounded-lg text-sm flex items-center gap-2 transition-colors">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                        刷新
                    </button>
                    <div id="syncStatus" class="text-white/60 text-sm flex items-center gap-1">
                        <span class="w-2 h-2 bg-green-400 rounded-full animate-pulse"></span>
                        已同步
                    </div>
                </div>
            </div>
        </div>
    </header>

    <div class="container mx-auto px-4 py-8 max-w-6xl">
        <!-- Stats Cards -->
        <div class="grid grid-cols-2 md:grid-cols-5 gap-4 mb-8">
            <div class="bg-white rounded-2xl p-6 shadow-sm card-hover">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm">本周客户</p>
                        <p class="text-3xl font-bold text-gray-800 mt-1" id="totalCount">0</p>
                    </div>
                    <div class="w-12 h-12 bg-emerald-100 rounded-xl flex items-center justify-center"><span class="text-2xl">👥</span></div>
                </div>
            </div>
            <div class="bg-white rounded-2xl p-6 shadow-sm card-hover">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm">已恢复</p>
                        <p class="text-3xl font-bold text-emerald-500 mt-1" id="recoveredCount">0</p>
                    </div>
                    <div class="w-12 h-12 bg-emerald-100 rounded-xl flex items-center justify-center"><span class="text-2xl">✅</span></div>
                </div>
            </div>
            <div class="bg-white rounded-2xl p-6 shadow-sm card-hover">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm">未恢复</p>
                        <p class="text-3xl font-bold text-amber-500 mt-1" id="pendingCount">0</p>
                    </div>
                    <div class="w-12 h-12 bg-amber-100 rounded-xl flex items-center justify-center"><span class="text-2xl">⏳</span></div>
                </div>
            </div>
            <div class="bg-white rounded-2xl p-6 shadow-sm card-hover">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm">成单金额</p>
                        <p class="text-3xl font-bold text-gray-800 mt-1" id="totalAmount">$0</p>
                    </div>
                    <div class="w-12 h-12 bg-blue-100 rounded-xl flex items-center justify-center"><span class="text-2xl">💰</span></div>
                </div>
            </div>
            <div class="bg-white rounded-2xl p-6 shadow-sm card-hover">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm">平均金额</p>
                        <p class="text-3xl font-bold text-gray-800 mt-1" id="avgAmount">$0</p>
                    </div>
                    <div class="w-12 h-12 bg-purple-100 rounded-xl flex items-center justify-center"><span class="text-2xl">📊</span></div>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Form -->
            <div class="lg:col-span-1">
                <div class="glass rounded-2xl shadow-lg p-6 sticky top-4">
                    <div class="flex items-center justify-between mb-4">
                        <h2 class="text-lg font-bold text-gray-800">➕ 新增客户</h2>
                        <span class="text-xs bg-gray-100 text-gray-500 px-2 py-1 rounded">* 必填</span>
                    </div>
                    
                    <form id="customerForm" class="space-y-4">
                        <!-- 客户状态 -->
                        <div class="flex gap-3 mb-4">
                            <button type="button" onclick="setStatus('recovered')" id="statusRecovered" class="status-yes flex-1 py-3 rounded-xl text-white font-bold flex items-center justify-center gap-2 opacity-50">
                                ✅ 已恢复
                            </button>
                            <button type="button" onclick="setStatus('pending')" id="statusPending" class="status-no flex-1 py-3 rounded-xl text-white font-bold flex items-center justify-center gap-2 opacity-100">
                                ⏳ 未恢复
                            </button>
                        </div>
                        <input type="hidden" id="status" value="pending">
                        
                        <!-- 国家/区域 -->
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">🌍 国家 *</label>
                                <input type="text" id="country" list="countryList" required class="w-full px-4 py-3 bg-gray-50 border-0 rounded-xl input-focus" placeholder="搜索或输入">
                                <datalist id="countryList"></datalist>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">📍 区域</label>
                                <input type="text" id="region" list="regionList" class="w-full px-4 py-3 bg-gray-50 border-0 rounded-xl input-focus" placeholder="搜索或输入">
                                <datalist id="regionList">
                                    <option value="🌏 东南亚">
                                    <option value="🇪🇺 欧洲">
                                    <option value="🌍 中东">
                                    <option value="🌎 南美洲">
                                    <option value="🇺🇸 北美洲">
                                    <option value="🇦🇺 大洋洲">
                                    <option value="🇦🇫 南亚">
                                    <option value="🌍 非洲">
                                </datalist>
                            </div>
                        </div>
                        
                        <!-- 客户名称 -->
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">👤 客户名称 *</label>
                            <input type="text" id="customerName" required class="w-full px-4 py-3 bg-gray-50 border-0 rounded-xl input-focus" placeholder="公司或个人名称">
                        </div>
                        
                        <!-- 联系方式 -->
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">📞 电话 *</label>
                                <input type="tel" id="phone" required class="w-full px-4 py-3 bg-gray-50 border-0 rounded-xl input-focus" placeholder="必填">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">📧 邮箱</label>
                                <input type="email" id="email" class="w-full px-4 py-3 bg-gray-50 border-0 rounded-xl input-focus" placeholder="可选">
                            </div>
                        </div>
                        
                        <!-- 获客途径 -->
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">📢 获客途径</label>
                            <input type="text" id="source" list="sourceList" class="w-full px-4 py-3 bg-gray-50 border-0 rounded-xl input-focus" placeholder="搜索或输入新渠道">
                            <datalist id="sourceList">
                                <option value="🛒 Alibaba">
                                <option value="🏭 Made-in-China">
                                <option value="🔍 Google搜索">
                                <option value="🎪 展会">
                                <option value="📱 社交媒体">
                                <option value="🤝 老客户推荐">
                                <option value="📞 电话营销">
                                <option value="📰 B2B平台">
                                <option value="🌐 官网询盘">
                                <option value="📌 其他">
                            </datalist>
                        </div>
                        
                        <!-- 客户背景 -->
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">🏢 客户背景</label>
                            <input type="text" id="background" class="w-full px-4 py-3 bg-gray-50 border-0 rounded-xl input-focus" placeholder="如：健身房、经销商、批发商">
                        </div>
                        
                        <!-- 成单金额 -->
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">💰 成单金额 (USD)</label>
                            <input type="number" id="amount" class="w-full px-4 py-3 bg-gray-50 border-0 rounded-xl input-focus" placeholder="0">
                        </div>
                        
                        <!-- 具体需求 -->
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">📝 具体需求</label>
                            <textarea id="details" rows="2" class="w-full px-4 py-3 bg-gray-50 border-0 rounded-xl input-focus resize-none" placeholder="客户的具体需求..."></textarea>
                        </div>
                        
                        <button type="submit" class="btn-primary w-full py-4 text-white font-bold rounded-xl shadow-lg flex items-center justify-center gap-2">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"/></svg>
                            保存客户信息
                        </button>
                    </form>
                </div>
            </div>
            
            <!-- Records -->
            <div class="lg:col-span-2">
                <!-- Search & Filter -->
                <div class="bg-white rounded-2xl shadow-sm p-4 mb-6 flex flex-wrap gap-4">
                    <div class="flex-1 min-w-[200px] relative">
                        <svg class="w-5 h-5 text-gray-400 absolute left-4 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                        <input type="text" id="searchInput" oninput="filterRecords()" placeholder="搜索客户名称、电话..." class="w-full pl-12 pr-4 py-3 bg-gray-50 border-0 rounded-xl input-focus">
                    </div>
                    <select id="statusFilter" onchange="filterRecords()" class="px-4 py-3 bg-gray-50 border-0 rounded-xl input-focus">
                        <option value="">全部状态</option>
                        <option value="recovered">✅ 已恢复</option>
                        <option value="pending">⏳ 未恢复</option>
                    </select>
                    <select id="sourceFilter" onchange="filterRecords()" class="px-4 py-3 bg-gray-50 border-0 rounded-xl input-focus">
                        <option value="">全部渠道</option>
                        <option value="Alibaba">Alibaba</option>
                        <option value="Made-in-China">Made-in-China</option>
                        <option value="Google搜索">Google搜索</option>
                        <option value="展会">展会</option>
                        <option value="社交媒体">社交媒体</option>
                        <option value="老客户推荐">老客户推荐</option>
                    </select>
                    <select id="regionFilter" onchange="filterRecords()" class="px-4 py-3 bg-gray-50 border-0 rounded-xl input-focus">
                        <option value="">全部区域</option>
                        <option value="东南亚">🌏 东南亚</option>
                        <option value="欧洲">🇪🇺 欧洲</option>
                        <option value="中东">🌍 中东</option>
                        <option value="南美洲">🌎 南美洲</option>
                        <option value="北美洲">🇺🇸 北美洲</option>
                        <option value="大洋洲">🇦🇺 大洋洲</option>
                        <option value="南亚">🇦🇫 南亚</option>
                        <option value="非洲">🌍 非洲</option>
                    </select>
                </div>
                
                <!-- Records List -->
                <div class="bg-white rounded-2xl shadow-lg overflow-hidden">
                    <div class="p-6 border-b border-gray-100 flex justify-between items-center">
                        <h2 class="text-lg font-bold text-gray-800 flex items-center gap-2">
                            <span>📜</span> 本周记录
                        </h2>
                        <span id="recordCount" class="text-gray-500 text-sm">0 条</span>
                    </div>
                    <div id="recordsList" class="divide-y divide-gray-100">
                        <p class="text-gray-500 text-center py-12">加载中...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="fixed bottom-6 right-6 hidden transform transition-all duration-300 translate-y-4 opacity-0"></div>

    <script>
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbwtBYl3LNMhsVYrgLMmFWu1XEt--MydD-tpgl0LKZPJwxLtP2p1cHiZUeorEyIzQsb7/exec';
        let allRecords = [];
        let filteredRecords = [];
        
        // 预设数据
        const regionOptions = ['🌏 东南亚', '🇪🇺 欧洲', '🌍 中东', '🌎 南美洲', '🇺🇸 北美洲', '🇦🇺 大洋洲', '🇦🇫 南亚', '🌍 非洲'];
        const sourceOptions = ['🛒 Alibaba', '🏭 Made-in-China', '🔍 Google搜索', '🎪 展会', '📱 社交媒体', '🤝 老客户推荐', '📞 电话营销', '📰 B2B平台', '🌐 官网询盘', '📌 其他'];
        const countryOptions = ['USA', 'UK', 'Germany', 'France', 'Australia', 'Canada', 'Japan', 'South Korea', 'Singapore', 'Malaysia', 'Thailand', 'Vietnam', 'Indonesia', 'Philippines', 'UAE', 'Saudi Arabia', 'Turkey', 'Brazil', 'Mexico', 'Argentina', 'Colombia', 'India', 'Russia', 'Italy', 'Spain', 'Netherlands', 'Poland', 'Czech Republic', 'Romania', 'Hungary', 'Bulgaria', 'Slovakia', 'Croatia', 'Serbia', 'Bosnia', 'Greece', 'Portugal', 'Sweden', 'Norway', 'Finland', 'Denmark', 'Belgium', 'Switzerland', 'Austria'];
        
        // 初始化datalist
        document.getElementById('regionList').innerHTML = regionOptions.map(r => `<option value="${r}">`).join('');
        document.getElementById('sourceList').innerHTML = sourceOptions.map(s => `<option value="${s}">`).join('');
        document.getElementById('countryList').innerHTML = countryOptions.map(c => `<option value="${c}">`).join('');

        function setStatus(status) {
            document.getElementById('status').value = status;
            document.getElementById('statusRecovered').style.opacity = status === 'recovered' ? '100%' : '50%';
            document.getElementById('statusPending').style.opacity = status === 'pending' ? '100%' : '50%';
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadRecords();
        });

        function updateWeekInfo() {
            const now = new Date();
            const weekInfo = getWeekInfo(now);
            document.getElementById('weekInfo').textContent = `📅 ${weekInfo} · 本周数据`;
        }

        function getWeekInfo(date) {
            const year = date.getFullYear();
            const month = date.getMonth() + 1;
            const dayOfMonth = date.getDate();
            const weekNum = Math.ceil(dayOfMonth / 7);
            
            const weekStart = new Date(date);
            weekStart.setDate(date.getDate() - date.getDay() + 1);
            const weekEnd = new Date(weekStart);
            weekEnd.setDate(weekStart.getDate() + 6);
            
            const startStr = `${formatMonthDay(weekStart)}`;
            const endStr = `${formatMonthDay(weekEnd)}`;
            
            return `${year}年${month}月 ${startStr}-${endStr}（第${weekNum}周）`;
        }

        function formatMonthDay(date) {
            const month = date.getMonth() + 1;
            const day = date.getDate();
            return `${month}月${day}日`;
        }

        async function loadRecords() {
            updateWeekInfo();
            const listEl = document.getElementById('recordsList');
            listEl.innerHTML = '<p class="text-gray-500 text-center py-12">🔄 同步中...</p>';
            
            try {
                const response = await fetch(GAS_URL + '?action=list');
                const result = await response.json();
                
                if (result.success) {
                    allRecords = result.records || [];
                    filterRecords();
                    updateStats();
                    showSyncStatus();
                }
            } catch (error) {
                listEl.innerHTML = `<p class="text-red-500 text-center py-12">❌ 同步失败: ${error.message}</p>`;
            }
        }

        function refreshData() {
            loadRecords();
            showToast('🔄 已刷新', 'success');
        }

        function filterRecords() {
            const keyword = document.getElementById('searchInput').value.toLowerCase().trim();
            const statusFilter = document.getElementById('statusFilter').value;
            const sourceFilter = document.getElementById('sourceFilter').value;
            const regionFilter = document.getElementById('regionFilter').value;
            
            filteredRecords = allRecords.filter(r => {
                const match = !keyword || 
                    r.customerName.toLowerCase().includes(keyword) ||
                    r.phone.includes(keyword) ||
                    (r.country && r.country.toLowerCase().includes(keyword));
                const matchStatus = !statusFilter || r.status === statusFilter;
                const matchSource = !sourceFilter || r.source === sourceFilter;
                const matchRegion = !regionFilter || (r.region && r.region.includes(regionFilter));
                return match && matchStatus && matchSource && matchRegion;
            });
            
            renderRecords();
            updateStats();
        }

        function renderRecords() {
            const listEl = document.getElementById('recordsList');
            document.getElementById('recordCount').textContent = filteredRecords.length + ' 条';
            
            if (filteredRecords.length === 0) {
                listEl.innerHTML = `<div class="text-center py-12"><span class="text-4xl">📭</span><p class="text-gray-500 mt-2">暂无记录</p></div>`;
                return;
            }
            
            const sorted = [...filteredRecords].sort((a, b) => new Date(b.time) - new Date(a.time));
            
            listEl.innerHTML = sorted.map((r, i) => `
                <div class="p-6 hover:bg-gray-50 transition-colors card-hover border-l-4 ${r.status === 'recovered' ? 'border-emerald-500' : 'border-amber-500'}">
                    <div class="flex justify-between items-start">
                        <div class="flex-1">
                            <div class="flex items-center gap-3 mb-2 flex-wrap">
                                <span class="font-bold text-lg text-gray-800">${r.customerName}</span>
                                ${r.status === 'recovered' ? '<span class="bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded text-xs">✅ 已恢复</span>' : '<span class="bg-amber-100 text-amber-700 px-2 py-0.5 rounded text-xs">⏳ 未恢复</span>'}
                                ${r.country ? `<span class="bg-blue-100 text-blue-700 px-2 py-0.5 rounded text-xs">${r.country}</span>` : ''}
                                ${r.region ? `<span class="bg-gray-100 text-gray-700 px-2 py-0.5 rounded text-xs">${r.region}</span>` : ''}
                                ${r.source ? `<span class="bg-purple-100 text-purple-700 px-2 py-0.5 rounded text-xs">${r.source}</span>` : ''}
                            </div>
                            <div class="flex flex-wrap gap-4 text-sm text-gray-500">
                                <span class="flex items-center gap-1">📞 ${r.phone}</span>
                                ${r.email ? `<span class="flex items-center gap-1">📧 ${r.email}</span>` : ''}
                                ${r.background ? `<span class="flex items-center gap-1">🏢 ${r.background}</span>` : ''}
                            </div>
                            ${r.details ? `<p class="text-gray-400 text-sm mt-2">📝 ${r.details}</p>` : ''}
                        </div>
                        <div class="text-right">
                            <p class="text-2xl font-bold ${r.status === 'recovered' ? 'text-emerald-500' : 'text-gray-400'}">$${(r.amount || 0).toLocaleString()}</p>
                            <p class="text-xs text-gray-400 mt-1">${formatDate(r.time)}</p>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function updateStats() {
            document.getElementById('totalCount').textContent = filteredRecords.length;
            const recovered = filteredRecords.filter(r => r.status === 'recovered').length;
            const pending = filteredRecords.filter(r => r.status !== 'recovered').length;
            document.getElementById('recoveredCount').textContent = recovered;
            document.getElementById('pendingCount').textContent = pending;
            
            const total = filteredRecords.filter(r => r.status === 'recovered').reduce((sum, r) => sum + (parseFloat(r.amount) || 0), 0);
            document.getElementById('totalAmount').textContent = '$' + total.toLocaleString();
            
            const avg = recovered > 0 ? Math.round(total / recovered) : 0;
            document.getElementById('avgAmount').textContent = '$' + avg.toLocaleString();
        }

        function formatDate(dateStr) {
            const d = new Date(dateStr);
            return d.toLocaleDateString('zh-CN', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
        }

        document.getElementById('customerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const data = {
                phone: document.getElementById('phone').value.trim(),
                country: document.getElementById('country').value.trim(),
                region: document.getElementById('region').value.trim(),
                customerName: document.getElementById('customerName').value.trim(),
                source: document.getElementById('source').value,
                background: document.getElementById('background').value.trim(),
                details: document.getElementById('details').value.trim(),
                amount: parseFloat(document.getElementById('amount').value) || 0,
                email: document.getElementById('email').value.trim(),
                status: document.getElementById('status').value
            };

            if (!data.phone || !data.country || !data.customerName) {
                showToast('❌ 请填写必填字段', 'error');
                return;
            }

            const btn = e.target.querySelector('button[type="submit"]');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<span class="animate-pulse">💾 保存中...</span>';
            btn.disabled = true;

            try {
                const response = await fetch(GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showToast('✅ ' + result.message, 'success');
                    document.getElementById('customerForm').reset();
                    setStatus('pending');
                    loadRecords();
                } else {
                    showToast('⚠️ ' + result.message, result.existing ? 'warning' : 'error');
                    if (result.existing) loadRecords();
                }
            } catch (error) {
                showToast('❌ ' + error.message, 'error');
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        });

        function showToast(msg, type = 'success') {
            const el = document.getElementById('toast');
            const colors = { success: 'bg-emerald-500 text-white', error: 'bg-red-500 text-white', warning: 'bg-yellow-500 text-white' };
            el.textContent = msg;
            el.className = `fixed bottom-6 right-6 px-6 py-3 rounded-xl shadow-lg flex items-center gap-2 ${colors[type]}`;
            el.classList.remove('hidden', 'translate-y-4', 'opacity-0');
            setTimeout(() => { el.classList.add('translate-y-4', 'opacity-0'); setTimeout(() => el.classList.add('hidden'), 300); }, 3000);
        }

        function showSyncStatus() {
            const el = document.getElementById('syncStatus');
            el.innerHTML = '<span class="w-2 h-2 bg-green-400 rounded-full"></span> 已同步';
        }

        setInterval(loadRecords, 30000);
    </script>
</body>
</html>
