<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>客户记录系统 | MBH - 预览版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass { background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); }
        .card-hover { transition: all 0.3s ease; }
        .card-hover:hover { transform: translateY(-2px); box-shadow: 0 20px 40px -12px rgba(0,0,0,0.1); }
        .gradient-bg { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .input-focus { transition: all 0.2s; }
        .input-focus:focus { box-shadow: 0 0 0 3px rgba(16,185,129,0.2); }
        .btn-primary { background: linear-gradient(135deg, #10b981 0%, #059669 100%); }
        .btn-primary:hover { background: linear-gradient(135deg, #059669 0%, #047857 100%); }
        .status-yes { background: linear-gradient(135deg, #10b981 0%, #059669 100%); }
        .status-no { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); }
        .readonly-field { background-color: #f3f4f6; cursor: not-allowed; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <header class="gradient-bg text-white py-6 shadow-lg">
        <div class="container mx-auto px-4 max-w-6xl">
            <div class="flex justify-between items-center">
                <div>
                    <h1 class="text-2xl font-bold flex items-center gap-2">
                        <span class="text-3xl">📋</span> 客户记录系统
                    </h1>
                    <p id="weekInfo" class="text-white/80 text-sm mt-1">📅 2026年2月2日-2月8日（第1周） · 预览版</p>
                </div>
                <div class="flex items-center gap-4">
                    <button onclick="refreshDemo()" class="bg-white/20 hover:bg-white/30 px-4 py-2 rounded-lg text-sm flex items-center gap-2 transition-colors">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
                        🔄 同步数据
                    </button>
                    <span id="lastSync" class="text-white/60 text-sm">未同步</span>
                </div>
            </div>
        </div>
    </header>

    <div class="container mx-auto px-4 py-8 max-w-6xl">
        <div class="grid grid-cols-2 md:grid-cols-5 gap-4 mb-8">
            <div class="bg-white rounded-2xl p-6 shadow-sm card-hover">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm">本周客户</p>
                        <p class="text-3xl font-bold text-gray-800 mt-1" id="totalCount">2</p>
                    </div>
                    <div class="w-12 h-12 bg-emerald-100 rounded-xl flex items-center justify-center"><span class="text-2xl">👥</span></div>
                </div>
            </div>
            <div class="bg-white rounded-2xl p-6 shadow-sm card-hover">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm">已回复</p>
                        <p class="text-3xl font-bold text-emerald-500 mt-1" id="repliedCount">1</p>
                    </div>
                    <div class="w-12 h-12 bg-emerald-100 rounded-xl flex items-center justify-center"><span class="text-2xl">✅</span></div>
                </div>
            </div>
            <div class="bg-white rounded-2xl p-6 shadow-sm card-hover">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm">未回复</p>
                        <p class="text-3xl font-bold text-amber-500 mt-1" id="unrepliedCount">1</p>
                    </div>
                    <div class="w-12 h-12 bg-amber-100 rounded-xl flex items-center justify-center"><span class="text-2xl">⏳</span></div>
                </div>
            </div>
            <div class="bg-white rounded-2xl p-6 shadow-sm card-hover">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm">成单金额</p>
                        <p class="text-3xl font-bold text-gray-800 mt-1" id="totalAmount">$2,000</p>
                    </div>
                    <div class="w-12 h-12 bg-blue-100 rounded-xl flex items-center justify-center"><span class="text-2xl">💰</span></div>
                </div>
            </div>
            <div class="bg-white rounded-2xl p-6 shadow-sm card-hover">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-500 text-sm">平均金额</p>
                        <p class="text-3xl font-bold text-gray-800 mt-1" id="avgAmount">$2,000</p>
                    </div>
                    <div class="w-12 h-12 bg-purple-100 rounded-xl flex items-center justify-center"><span class="text-2xl">📊</span></div>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-1">
                <div class="glass rounded-2xl shadow-lg p-6 sticky top-4">
                    <div class="flex items-center justify-between mb-4">
                        <h2 class="text-lg font-bold text-gray-800" id="formTitle">➕ 新增客户</h2>
                        <button onclick="resetForm()" class="text-gray-400 hover:text-gray-600 text-sm">🔄 新增模式</button>
                    </div>
                    
                    <form id="customerForm" class="space-y-4">
                        <div class="flex gap-3 mb-4">
                            <button type="button" onclick="setStatus('replied')" id="statusReplied" class="status-yes flex-1 py-3 rounded-xl text-white font-bold flex items-center justify-center gap-2 opacity-50">
                                ✅ 已回复
                            </button>
                            <button type="button" onclick="setStatus('unreplied')" id="statusUnreplied" class="status-no flex-1 py-3 rounded-xl text-white font-bold flex items-center justify-center gap-2 opacity-100">
                                ⏳ 未回复
                            </button>
                        </div>
                        <input type="hidden" id="status" value="unreplied">
                        <input type="hidden" id="editRowIndex" value="">
                        
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">🌍 国家 *</label>
                                <input type="text" id="country" list="countryList" required class="w-full px-4 py-3 bg-gray-50 border-0 rounded-xl input-focus" placeholder="搜索或输入">
                                <datalist id="countryList"></datalist>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">📍 区域</label>
                                <input type="text" id="region" list="regionList" class="w-full px-4 py-3 bg-gray-50 border-0 rounded-xl input-focus" placeholder="搜索或输入">
                                <datalist id="regionList">
                                    <option value="🌏 东南亚">
                                    <option value="🇪                                    <option value🇺 欧洲">
="🌍 中东">
                                    <option value="🌎 南美洲">
                                </datalist>
                            </div>
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">👤 客户名称 *</label>
                            <input type="text" id="customerName" required class="w-full px-4 py-3 bg-gray-50 border-0 rounded-xl input-focus" placeholder="公司或个人名称">
                        </div>
                        
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">📞 电话 *</label>
                                <input type="tel" id="phone" required class="w-full px-4 py-3 bg-gray-50 border-0 rounded-xl input-focus" placeholder="必填">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">📧 邮箱</label>
                                <input type="email" id="email" class="w-full px-4 py-3 bg-gray-50 border-0 rounded-xl input-focus" placeholder="可选">
                            </div>
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">📢 获客途径</label>
                            <input type="text" id="source" list="sourceList" class="w-full px-4 py-3 bg-gray-50 border-0 rounded-xl input-focus" placeholder="搜索或输入">
                            <datalist id="sourceList">
                                <option value="🛒 Alibaba">
                                <option value="🏭 Made-in-China">
                                <option value="🔍 Google搜索">
                                <option value="🎪 展会">
                                <option value="📱 社交媒体">
                                <option value="🤝 老客户推荐">
                            </datalist>
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">🏢 客户背景</label>
                            <input type="text" id="background" class="w-full px-4 py-3 bg-gray-50 border-0 rounded-xl input-focus" placeholder="如：健身房">
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">💰 成单金额 (USD)</label>
                            <input type="number" id="amount" class="w-full px-4 py-3 bg-gray-50 border-0 rounded-xl input-focus" placeholder="0">
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">📝 具体需求</label>
                            <textarea id="details" rows="2" class="w-full px-4 py-3 bg-gray-50 border-0 rounded-xl input-focus resize-none" placeholder=""></textarea>
                        </div>
                        
                        <button type="submit" id="submitBtn" class="btn-primary w-full py-4 text-white font-bold rounded-xl shadow-lg flex items-center justify-center gap-2">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"/></svg>
                            保存客户信息
                        </button>
                    </form>
                </div>
            </div>
            
            <div class="lg:col-span-2">
                <div class="bg-white rounded-2xl shadow-sm p-4 mb-6 flex flex-wrap gap-4">
                    <div class="flex-1 min-w-[200px] relative">
                        <svg class="w-5 h-5 text-gray-400 absolute left-4 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                        <input type="text" id="searchInput" oninput="filterRecords()" placeholder="搜索客户名称、电话..." class="w-full pl-12 pr-4 py-3 bg-gray-50 border-0 rounded-xl input-focus">
                    </div>
                    <select id="statusFilter" onchange="filterRecords()" class="px-4 py-3 bg-gray-50 border-0 rounded-xl input-focus">
                        <option value="">全部状态</option>
                        <option value="replied">✅ 已回复</option>
                        <option value="unreplied">⏳ 未回复</option>
                    </select>
                    <select id="regionFilter" onchange="filterRecords()" class="px-4 py-3 bg-gray-50 border-0 rounded-xl input-focus">
                        <option value="">全部区域</option>
                        <option value="东南亚">🌏 东南亚</option>
                        <option value="欧洲">🇪🇺 欧洲</option>
                    </select>
                </div>
                
                <div class="bg-white rounded-2xl shadow-lg overflow-hidden">
                    <div class="p-6 border-b border-gray-100 flex justify-between items-center">
                        <h2 class="text-lg font-bold text-gray-800 flex items-center gap-2">
                            <span>📜</span> 本周记录
                        </h2>
                        <span id="recordCount" class="text-gray-500 text-sm">2 条</span>
                    </div>
                    <div id="recordsList" class="divide-y divide-gray-100">
                        <div class="p-6 hover:bg-gray-50 transition-colors card-hover border-l-4 border-emerald-500">
                            <div class="flex justify-between items-start">
                                <div class="flex-1">
                                    <div class="flex items-center gap-3 mb-2 flex-wrap">
                                        <span class="font-bold text-lg text-gray-800">ABC Fitness Gym</span>
                                        <span class="bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded text-xs">✅ 已回复</span>
                                        <span class="bg-blue-100 text-blue-700 px-2 py-0.5 rounded text-xs">USA</span>
                                        <span class="bg-gray-100 text-gray-700 px-2 py-0.5 rounded text-xs">🌏 东南亚</span>
                                    </div>
                                    <div class="flex flex-wrap gap-4 text-sm text-gray-500">
                                        <span class="flex items-center gap-1">📞 +1-555-1234</span>
                                        <span class="flex items-center gap-1">📧 john@gym.com</span>
                                    </div>
                                </div>
                                <div class="text-right">
                                    <p class="text-2xl font-bold text-emerald-500">$2,000</p>
                                    <p class="text-xs text-gray-400 mt-1">今天</p>
                                    <button onclick="editDemoRecord('+1-555-1234')" class="mt-2 text-blue-500 hover:text-blue-700 text-sm flex items-center gap-1 justify-end">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                                        编辑
                                    </button>
                                </div>
                            </div>
                        </div>
                        
                        <div class="p-6 hover:bg-gray-50 transition-colors card-hover border-l-4 border-amber-500">
                            <div class="flex justify-between items-start">
                                <div class="flex-1">
                                    <div class="flex items-center gap-3 mb-2 flex-wrap">
                                        <span class="font-bold text-lg text-gray-800">FitLife Center</span>
                                        <span class="bg-amber-100 text-amber-700 px-2 py-0.5 rounded text-xs">⏳ 未回复</span>
                                        <span class="bg-blue-100 text-blue-700 px-2 py-0.5 rounded text-xs">Australia</span>
                                        <span class="bg-gray-100 text-gray-700 px-2 py-0.5 rounded text-xs">🇦🇺 大洋洲</span>
                                    </div>
                                    <div class="flex flex-wrap gap-4 text-sm text-gray-500">
                                        <span class="flex items-center gap-1">📞 +61-400-1111</span>
                                    </div>
                                </div>
                                <div class="text-right">
                                    <p class="text-2xl font-bold text-gray-400">$0</p>
                                    <p class="text-xs text-gray-400 mt-1">周一</p>
                                    <button onclick="editDemoRecord('+61-400-1111')" class="mt-2 text-blue-500 hover:text-blue-700 text-sm flex items-center gap-1 justify-end">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                                        编辑
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="toast" class="fixed bottom-6 right-6 hidden transform transition-all duration-300 translate-y-4 opacity-0"></div>

    <script>
        const regionOptions = ['🌏 东南亚', '🇪🇺 欧洲', '🌍 中东', '🌎 南美洲', '🇺🇸 北美洲', '🇦🇺 大洋洲'];
        const sourceOptions = ['🛒 Alibaba', '🏭 Made-in-China', '🔍 Google搜索', '🎪 展会', '📱 社交媒体', '🤝 老客户推荐'];
        const countryOptions = ['USA', 'UK', 'Germany', 'France', 'Australia', 'Canada', 'Japan', 'South Korea', 'Singapore', 'Malaysia'];
        
        document.getElementById('regionList').innerHTML = regionOptions.map(r => `<option value="${r}">`).join('');
        document.getElementById('sourceList').innerHTML = sourceOptions.map(s => `<option value="${s}">`).join('');
        document.getElementById('countryList').innerHTML = countryOptions.map(c => `<option value="${c}">`).join('');

        let allRecords = [
            { time: new Date(), status: 'replied', phone: '+1-555-1234', email: 'john@gym.com', country: 'USA', region: '🌏 东南亚', customerName: 'ABC Fitness Gym', source: '🤝 老客户推荐', background: '健身房', details: '需要20台器材', amount: 2000 },
            { time: new Date(Date.now() - 172800000), status: 'unreplied', phone: '+61-400-1111', email: '', country: 'Australia', region: '🇦🇺 大洋洲', customerName: 'FitLife Center', source: '🔍 Google搜索', background: '健身房', details: '咨询家用器材', amount: 0 }
        ];
        let filteredRecords = [];

        function setStatus(status) {
            document.getElementById('status').value = status;
            document.getElementById('statusReplied').style.opacity = status === 'replied' ? '100%' : '50%';
            document.getElementById('statusUnreplied').style.opacity = status === 'unreplied' ? '100%' : '50%';
        }

        function resetForm() {
            document.getElementById('customerForm').reset();
            document.getElementById('formTitle').innerHTML = '➕ 新增客户';
            document.getElementById('editRowIndex').value = '';
            document.getElementById('phone').removeAttribute('readonly');
            document.getElementById('phone').classList.remove('readonly-field');
            setStatus('unreplied');
        }

        function editDemoRecord(phone) {
            const r = allRecords.find(rec => rec.phone === phone);
            if (!r) return;
            
            document.getElementById('formTitle').innerHTML = '✏️ 编辑客户';
            document.getElementById('status').value = r.status || 'unreplied';
            setStatus(r.status || 'unreplied');
            document.getElementById('country').value = r.country || '';
            document.getElementById('region').value = r.region || '';
            document.getElementById('customerName').value = r.customerName || '';
            document.getElementById('phone').value = r.phone || '';
            document.getElementById('phone').setAttribute('readonly', true);
            document.getElementById('phone').classList.add('readonly-field');
            document.getElementById('email').value = r.email || '';
            document.getElementById('source').value = r.source || '';
            document.getElementById('background').value = r.background || '';
            document.getElementById('amount').value = r.amount || '';
            document.getElementById('details').value = r.details || '';
            document.getElementById('editRowIndex').value = r.phone;
            
            const btn = document.getElementById('submitBtn');
            btn.innerHTML = `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg> 更新记录`;
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
            showToast('✏️ 正在编辑: ' + r.customerName, 'success');
        }

        function filterRecords() {
            const keyword = document.getElementById('searchInput').value.toLowerCase().trim();
            const statusFilter = document.getElementById('statusFilter').value;
            const regionFilter = document.getElementById('regionFilter').value;
            
            filteredRecords = allRecords.filter(r => {
                const match = !keyword || r.customerName.toLowerCase().includes(keyword) || r.phone.includes(keyword);
                const matchStatus = !statusFilter || r.status === statusFilter;
                const matchRegion = !regionFilter || (r.region && r.region.includes(regionFilter));
                return match && matchStatus && matchRegion;
            });
            
            document.getElementById('recordCount').textContent = filteredRecords.length + ' 条';
            updateStats();
        }

        function updateStats() {
            document.getElementById('totalCount').textContent = filteredRecords.length;
            const replied = filteredRecords.filter(r => r.status === 'replied').length;
            const unreplied = filteredRecords.filter(r => r.status !== 'replied').length;
            document.getElementById('repliedCount').textContent = replied;
            document.getElementById('unrepliedCount').textContent = unreplied;
            const total = filteredRecords.filter(r => r.status === 'replied').reduce((sum, r) => sum + (parseFloat(r.amount) || 0), 0);
            document.getElementById('totalAmount').textContent = '$' + total.toLocaleString();
            const avg = replied > 0 ? Math.round(total / replied) : 0;
            document.getElementById('avgAmount').textContent = '$' + avg.toLocaleString();
        }

        document.getElementById('customerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const data = {
                phone: document.getElementById('phone').value.trim(),
                country: document.getElementById('country').value.trim(),
                region: document.getElementById('region').value.trim(),
                customerName: document.getElementById('customerName').value.trim(),
                source: document.getElementById('source').value,
                background: document.getElementById('background').value.trim(),
                details: document.getElementById('details').value.trim(),
                amount: parseFloat(document.getElementById('amount').value) || 0,
                email: document.getElementById('email').value.trim(),
                status: document.getElementById('status').value
            };

            if (!data.phone || !data.country || !data.customerName) {
                showToast('❌ 请填写必填字段', 'error');
                return;
            }

            const isEdit = !!document.getElementById('editRowIndex').value;
            if (isEdit) {
                const idx = allRecords.findIndex(r => r.phone === document.getElementByById('editRowIndex').value);
                if (idx !== -1) allRecords[idx] = { ...allRecords[idx], ...data };
                showToast('✅ ' + data.customerName + ' 已更新！（预览）', 'success');
            } else {
                allRecords.unshift(data);
                showToast('✅ ' + data.customerName + ' 保存成功！（预览）', 'success');
            }
            
            resetForm();
            filterRecords();
        });

        function showToast(msg, type = 'success') {
            const el = document.getElementById('toast');
            const colors = { success: 'bg-emerald-500 text-white', error: 'bg-red-500 text-white', warning: 'bg-yellow-500 text-white' };
            el.textContent = msg;
            el.className = `fixed bottom-6 right-6 px-6 py-3 rounded-xl shadow-lg flex items-center gap-2 ${colors[type]}`;
            el.classList.remove('hidden', 'translate-y-4', 'opacity-0');
            setTimeout(() => { el.classList.add('translate-y-4', 'opacity-0'); setTimeout(() => el.classList.add('hidden'), 300); }, 3000);
        }

        function refreshDemo() {
            document.getElementById('lastSync').textContent = '已同步: ' + new Date().toLocaleTimeString();
            document.getElementById('lastSync').className = 'text-green-400 text-sm';
            showToast('✅ 同步成功 (' + allRecords.length + ' 条)', 'success');
            filterRecords();
        }

        filterRecords();
    </script>
</body>
</html>
